name: Tu dong cap nhat Blocklist cho MikroTik

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tai va chuyen doi sang dinh dang MikroTik
        run: |
          DOMAIN="raw.""githubusercontent.com"
          curl -fsSL "https://${DOMAIN}/StevenBlack/hosts/master/alternates/gambling-porn/hosts" -o raw_hosts.txt
          grep -E "^0\.0\.0\.0 [a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$" raw_hosts.txt | awk '{print $2}' | grep -vE "google|microsoft|apple|facebook|zalo|edu\.vn|gov\.vn" | sort -u | head -n 2000 | awk '{print "/ip dns static add address=127.0.0.1 name=" $1}' > blocklist.rsc

      - name: Luu file blocklist.rsc moi len GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add blocklist.rsc
          git commit -m "Tu dong cap nhat danh sach chan moi nhat" || exit 0
          git push
